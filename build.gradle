plugins {
    // Publishing
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id "com.modrinth.minotaur" version "2.+"

    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.17.10'
    id 'maven-publish'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Version override: -PmcVersion=...
def activeMcVersion = project.findProperty("mcVersion") ?: project.minecraft_version
def baseModVersion = (project.mod_version as String).split("\\+")[0]

version = "${baseModVersion}+${activeMcVersion}"
group = project.maven_group
base { archivesName.set(project.archives_base_name) }

repositories {
    mavenCentral()
    mavenLocal()
    // Lokaler Fallback: lege Hyphen-0.4.0-rc.5.jar und Taski-2.1.0.jar hier ab,
    // falls notalpha.dev (Host von dev.notalpha-Artefakten) nicht erreichbar ist.
    flatDir { dirs 'libs' }
    maven {
        url 'https://jitpack.io'
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
        content {
            includeGroup "com.terraformersmc"
        }
    }
    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/dashloader.accesswidener")
    log4jConfigs.from(file("log4j-dev.xml"))
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${activeMcVersion}"
    // 26.1+ is unobfuscated: no mappings needed
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    implementation "dev.notalpha:Hyphen:0.4.0-rc.5"
    include "dev.notalpha:Hyphen:0.4.0-rc.5"

    implementation "dev.notalpha:Taski:2.1.0"
    include "dev.notalpha:Taski:2.1.0"

    implementation 'com.github.luben:zstd-jni:1.5.7-1'
    include 'com.github.luben:zstd-jni:1.5.7-1'
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"

}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", activeMcVersion

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": activeMcVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"

    it.options.release = 25
}

java {
    //include sources in maven publish
    withSourcesJar()
}

jar {
    archiveBaseName.set(project.archives_base_name)
    archiveVersion.set("${baseModVersion}+${activeMcVersion}")
    from("LICENCE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Publishing
modrinth {
    token = project.hasProperty("modrinthApiKey") ? project.modrinthApiKey : ""
    projectId = 'ZfQ3kTvR'
    changelog = file("changelog.md").getText()
    versionNumber = project.version
    versionName = "${baseModVersion} for ${activeMcVersion}"
    uploadFile = jar
    versionType = "beta"
    gameVersions = [activeMcVersion]
    loaders = ['fabric', 'quilt']
}

curseforge {
    apiKey = project.hasProperty("curseForgeApiKey") ? project.curseForgeApiKey : ""
    project {
        id = '472772'
        changelogType = "markdown"
        changelog = file("changelog.md")
        releaseType = 'beta'

        addGameVersion activeMcVersion
        addGameVersion "Fabric"
        addGameVersion "Quilt"
        addGameVersion "Java 25"

        mainArtifact(jar) {
            displayName = "${baseModVersion} for ${activeMcVersion}"
        }
    }
    options {
        forgeGradleIntegration = false
    }
}

tasks.register("publishMod") {
    dependsOn 'modrinth'
    dependsOn 'curseforge'
}

tasks.register("getVersion") {
    print("$project.version")
}

publishing {
    repositories {
        maven {
            name = "notalpha"
            url = "https://notalpha.dev/maven/releases"
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
