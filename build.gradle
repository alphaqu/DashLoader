plugins {
    // Publishing via web UI / API (cursegradle 1.4.0 + minotaur 2.x are
    // incompatible with Gradle 9 and break project evaluation, so they stay off).
    // id 'com.matthewprenger.cursegradle' version '1.4.0'
    // id "com.modrinth.minotaur" version "2.+"

    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'maven-publish'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// NeoForge single-version branch: MC 1.21.11 (official Mojang mappings)
def activeMcVersion = project.minecraft_version
def baseModVersion = (project.mod_version as String).split("\\+")[0]

version = project.mod_version
group = project.maven_group
base { archivesName.set(project.archives_base_name) }

repositories {
    mavenCentral()
    mavenLocal()
    // Lokaler Fallback: lege Hyphen-0.4.0-rc.5.jar und Taski-2.1.0.jar hier ab,
    // falls notalpha.dev (Host von dev.notalpha-Artefakten) nicht erreichbar ist.
    flatDir { dirs 'libs' }
    maven {
        url 'https://jitpack.io'
    }
}

// Minecraft 1.21.11 targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Access Transformers are auto-detected at META-INF/accesstransformer.cfg, no declaration needed.

    // Default run configurations.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Bundled via Jar-in-Jar (replaces Loom `include`): compiles against the
    // preferred version and embeds it with a compatible version range.
    jarJar(implementation("dev.notalpha:Hyphen:0.4.0-rc.5")) {
        version {
            strictly '[0.4.0-rc.5]'
            prefer '0.4.0-rc.5'
        }
    }

    jarJar(implementation("dev.notalpha:Taski:2.1.0")) {
        version {
            strictly '[2.1.0]'
            prefer '2.1.0'
        }
    }

    jarJar(implementation('com.github.luben:zstd-jni:1.5.7-1')) {
        version {
            strictly '[1.5.7-1]'
            prefer '1.5.7-1'
        }
    }
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"

}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

processResources {
    def replaceProperties = [
        version          : project.version,
        minecraft_version: activeMcVersion,
        mod_id           : project.mod_id,
        mod_name         : project.mod_name,
        mod_license      : project.mod_license,
        mod_version      : project.mod_version,
        neo_version      : project.neo_version,
        minecraft_version_range: project.minecraft_version_range
    ]
    inputs.properties replaceProperties

    // Kept for reference / cross-loader jars; ignored by NeoForge at runtime.
    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"

    // Minecraft 1.21.11 uses Java 21.
    it.options.release = 21
}

java {
    //include sources in maven publish
    withSourcesJar()
}

jar {
    archiveBaseName.set(project.archives_base_name)
    archiveVersion.set(project.mod_version)
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Publishing (disabled: plugins incompatible with Gradle 9, see top).

tasks.register("getVersion") {
    print("$project.version")
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    repositories {
        maven {
            name = "notalpha"
            url = "https://notalpha.dev/maven/releases"
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
